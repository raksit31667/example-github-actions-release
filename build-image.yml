name: Build Image (once, SHA-tagged)
# Sticky notes addressed:
#  - "No more branch-out: Build Docker image only once and re-use it with every env"
#  - "Master Build becomes green after a successful run" (this job finishes on its own,
#    it no longer blocks on a downstream manual-approval/branch-out step)

on:
  push:
    branches: [master]
  workflow_call:
    outputs:
      image_tag:
        description: "Short commit SHA used as the image tag"
        value: ${{ jobs.build.outputs.image_tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: echo "run unit tests here"

      - name: Compute image tag (short SHA)
        id: tag
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (single image, reused by every environment)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/nginx:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
